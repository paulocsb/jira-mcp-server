services:
  server:
    build: .
    env_file: .env
    environment:
      - TRANSPORT=http
    ports:
      - "3000:3000"
    volumes:
      - jira-tokens:/home/mcp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  auth:
    build: .
    command: ["node", "dist/auth-server.js"]
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - jira-tokens:/home/mcp
    profiles:
      - auth

volumes:
  jira-tokens:
